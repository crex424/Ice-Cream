<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Images/icecreamfav.png">
    <link rel="stylesheet" href="Styles/ice_cream_styles.css">
    <!-- JavaScript -->
    <script src="js/ice-cream.js" defer></script>

    <title>Ice Cream</title>
</head>
<body>
    <div id="main">
        <div id="header">
            <h1>Ice Cream Order Form</h1>
        </div>
        <form action="#" id="ice-cream-form" method="get">
            <fieldset >
                <legend>Personal information</legend>
                <label for="name">Name:</label>
                <span id="err-name" class="error">Please Enter Your Name!</span>
                <input type="text" name="name" id="name">
                <label for="email">Email:</label>
                <span id="err-email" class="error">Please Enter Your email!</span>
                <input type="email" name="email" id="email">
            </fieldset>

            <fieldset>
                <legend>Order Details</legend>
                <!-- Flavors -->
                <label for="flavor" class="sub-heading">Choose your flavor:</label>
                <select name="flavor" id="flavor">
                    <option value="none">-- Select a Flavor --</option>
                    <option value="vanilla">Vanilla</option>
                    <option value="chocolate">Chocolate</option>
                    <option value="strawberry">Strawberry</option>
                    <option value="bubble-gum">Bubble Gum</option>
                </select>
                <span id="err-flavor" class="error">Please select a flavor!</span>
                <!-- Cone Type -->
                <label class="sub-heading">Choose your cone:</label>
                <label for="waffle">
                    <input type="radio" id="waffle" name="method" value="waffle">
                    Waffle Cone
                </label>
                <label for="sugar">
                    <input type="radio" id="sugar" name="method" value="sugar">
                    Sugar Cone
                </label>
                <label for="cup">
                    <input type="radio" id="cup" name="method" value="cup">
                    Cup
                </label>
                 <br>
                <span id="err-method" class="error">Please select cone type!</span>
                <!-- Toppings -->
                <label class="sub-heading">Toppings</label>
                <label for="sprinkles">
                    <input type="checkbox" id="sprinkles" name="toppings[]" value="sprinkles">
                    Sprinkles
                </label>
                <label for="cherry">
                    <input type="checkbox" id="cherry" name="toppings[]" value="cherry">
                    Cherry
                </label>
                <label for="hot-fudge">
                    <input type="checkbox" id="hot-fudge" name="toppings[]" value="hot-fudge">
                    Hot Fudge
                </label>
                <label for="oreo">
                    <input type="checkbox" id="oreo" name="toppings[]" value="oreo">
                    Oreo
                </label>
                <label for="comment" class="sub-heading">Additional comments</label>
                <textarea rows="5" name="comment" id="comment"></textarea>
            </fieldset>
            <!-- Submit button -->
             <div id="button">
                <button type="submit" id="order_button">Submit Order</button>
             </div>
        </form>
    </div>
</body>
</html>
